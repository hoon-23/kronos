spring:
  application:
    name: kronos

  datasource:
    url: jdbc:postgresql://localhost:5432/kronos
    username: kronos
    password: kronos1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
